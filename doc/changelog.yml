2.0.0beta1:
  api: 2.0.0alpha1
  state:
    release: beta
    api: alpha
  date: 2026-06-10
  license:
    identifier: LGPL-2.1
    uri: http://www.horde.org/licenses/lgpl21
  notes: "Modernization release. Adds a parallel PSR-4 implementation under\nHorde\\Pack\\ in src/, alongside the existing PSR-0 Horde_Pack code in\nlib/. Both implementations cohabit in the same package and produce\nidentical wire-format output - values packed by either class unpack\nunder the other.\nNew public API (Horde\\Pack\\): Packer (replaces Horde_Pack), Driver\ninterface (replaces Horde_Pack_Driver abstract class), Driver\\*\nclasses for each shipped backend, PackOptions value object (replaces\nthe untyped $opts array), DriverRegistry interface and\nDefaultDriverRegistry (replace the constructor-side\nFilesystemIterator discovery), Compressor interface and\nDefaultCompressor (wrap horde/compress_fast behind a local\nabstraction), WireFormat constants (formalize the on-disk header\nlayout), PackException (extends Horde\\Exception\\HordeRuntimeException).\nPHP 8.1 minimum. New code uses readonly typed properties, real\nparameter and return types, JSON_THROW_ON_ERROR, and unserialize\nallowed_classes as a first-class option.\nWire format is documented in doc/wire-format.md. Migration guide is\nin doc/UPGRADING.md.\nThe legacy Horde_Pack code in lib/ is unchanged. In-tree callers\n(horde/Core, horde/imp, horde/Imap_Client) continue to use it; any\nsweep onto Horde\\Pack\\Packer is a separate follow-up effort.\n"
